<!DOCTYPE html>
<html>
<head>
  <title>WikiChat</title>
</head>
<body>
  <h1>WikiChat</h1>
  <input id="query" type="text" placeholder="Ask about anything...">
  <button onclick="ask()">Ask</button>
  <p id="answer"></p>

  <script>
    async function ask() {
      let q = document.getElementById("query").value;
      let res = await fetch(`http://127.0.0.1:8000/chat?query=${encodeURIComponent(q)}`);
      let data = await res.json();
      document.getElementById("answer").innerText = data.answer;
    }
  </script>
</body>
</html>
